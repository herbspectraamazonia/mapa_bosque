<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Árvores do Bosque da Ciência – Coleta de espectros de casca</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--g:#1b5e20;--g2:#2e7d32;--bg:#fff;--tx:#1a1a1a;--mut:#666;--ok:#00c853;--sel:#ff6d00}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--tx)}
  #map{position:absolute;inset:0}
  #top{position:absolute;top:0;left:0;right:0;z-index:1000;padding:8px;display:flex;gap:6px;pointer-events:none}
  #top>*{pointer-events:auto}
  #q{flex:1;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid #bbb;box-shadow:0 2px 6px #0003}
  .btn{background:var(--bg);border:1px solid #bbb;border-radius:10px;padding:0 12px;font-size:15px;font-weight:600;box-shadow:0 2px 6px #0003;cursor:pointer;min-height:44px}
  .btn.on{background:var(--g2);color:#fff;border-color:var(--g2)}
  #fab{position:absolute;right:10px;top:64px;z-index:1000;display:flex;flex-direction:column;gap:8px}
  #fab .btn{width:48px;height:48px;padding:0;font-size:20px;border-radius:50%}
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:1001;background:var(--bg);border-radius:14px 14px 0 0;box-shadow:0 -3px 12px #0004;max-height:52vh;display:flex;flex-direction:column}
  #handle{padding:8px 12px 6px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee}
  #handle .tabs{display:flex;gap:6px;overflow-x:auto;flex:1}
  .tab{white-space:nowrap;border:1px solid #ccc;border-radius:16px;padding:6px 11px;font-size:13px;background:#f5f5f5;cursor:pointer}
  .tab.on{background:var(--g);color:#fff;border-color:var(--g)}
  #gps{font-size:12px;color:var(--mut);white-space:nowrap}
  #body{overflow-y:auto;padding:4px 0 env(safe-area-inset-bottom)}
  #body.hide{display:none}
  .row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #f0f0f0;cursor:pointer}
  .row:active{background:#e8f5e9}
  .row .c{font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace;min-width:74px}
  .row .s{flex:1;font-style:italic;font-size:14px;line-height:1.2}
  .row .s small{display:block;font-style:normal;color:var(--mut);font-size:12px}
  .row .d{text-align:right;font-size:13px;color:var(--g);font-weight:600;white-space:nowrap}
  .arrow{display:inline-block;transition:transform .3s}
  .done{color:var(--ok)}
  .tools{padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
  .tools select,.tools input[type=text]{font-size:15px;padding:7px;border-radius:8px;border:1px solid #bbb}
  .card{padding:12px}
  .card h3{margin:0 0 2px;font-size:22px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .card .sp{font-style:italic;font-size:17px}
  .card .meta{color:var(--mut);font-size:13px;margin:4px 0 10px}
  .card .acts{display:flex;flex-wrap:wrap;gap:8px}
  .card .acts .btn{font-size:14px}
  .nmL{margin-top:10px;font-size:12px;color:var(--mut)}.nm{margin-top:4px;padding:10px;background:#fff8e1;border:2px solid #ffb300;border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:700;line-height:1.25;word-break:break-all}.nm .us{color:#e65100}
  .big{font-size:26px;font-weight:700;color:var(--g)}
  #toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;z-index:2000;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
  .lbl{background:#fffffff0;border:0;border-radius:4px;padding:0 3px;font:700 11px ui-monospace,Menlo,Consolas,monospace;box-shadow:0 1px 2px #0005;color:#000}
  .lbl:before{display:none}
  .me{width:18px;height:18px;border-radius:50%;background:#1e88e5;border:3px solid #fff;box-shadow:0 0 0 2px #1e88e5,0 0 8px #000a}
  .leaflet-popup-content{margin:8px 10px;font-size:13px}
  .hl{background:#fff59d}
  p.note{font-size:12px;color:var(--mut);padding:0 12px}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <input id="q" type="search" placeholder="Buscar código, espécie, família, local…" autocomplete="off">
  <button class="btn" id="layerBtn" title="Trocar mapa base">🛰️</button>
  <button class="btn" id="campBtn" title="Mapa do Campus I">🏛️</button>
</div>
<div id="fab">
  <button class="btn" id="locBtn" title="Seguir minha posição">📍</button>
  <button class="btn" id="fitBtn" title="Ver todas">⤢</button>
</div>
<div id="toast"></div>

function drawMarkers(){
  layer.clearLayers();
  const z=map.getZoom(), fewHi=hiSet&&hiSet.size<=40;
  for(const d of pts){
    if(!visible(d))continue;
    let m=markers[d.i];
    if(!m){m=L.circleMarker([d.y,d.x]);m.on('click',()=>select(d,false));markers[d.i]=m}
    m.setStyle(style(d));
    m.unbindTooltip();
    const lab=z>=20||(z>=17&&((fewHi&&hiSet.has(d.i))||st.tgt[d.i]));
    if(lab&&(!hiSet||hiSet.has(d.i)||z>=21))m.bindTooltip(d.i,{permanent:true,direction:'right',offset:[6,0],className:'lbl'});
    m.addTo(layer);
  }
}
map.on('zoomend',drawMarkers);
function fitAll(){map.fitBounds(L.latLngBounds(pts.map(d=>[d.y,d.x])),{padding:[20,20]})}
document.getElementById('fitBtn').onclick=()=>{follow=false;locBtnUI();fitAll()};

// ---------- geo ----------
function dist(a,b,c,d){const R=6371000,r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r;const x=Math.sin(dl/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function bearing(a,b,c,d){const r=Math.PI/180;const y=Math.sin((d-b)*r)*Math.cos(c*r);const x=Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r);return (Math.atan2(y,x)/r+360)%360}
function card(b){return ['N','NE','L','SE','S','SO','O','NO'][Math.round(b/45)%8]}
function fmtD(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(2)+' km'}
let meMk=null, accC=null, line=null;
function onPos(p){
  me={y:p.coords.latitude,x:p.coords.longitude,acc:p.coords.accuracy};
  if(p.coords.heading!=null&&!isNaN(p.coords.heading))heading=p.coords.heading;
  const ll=[me.y,me.x];
  if(!meMk){meMk=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);accC=L.circle(ll,{radius:me.acc,weight:1,color:'#1e88e5',fillOpacity:.08}).addTo(map)}
  else{meMk.setLatLng(ll);accC.setLatLng(ll).setRadius(me.acc)}
  document.getElementById('gps').textContent='GPS ±'+Math.round(me.acc)+' m';
  if(follow)map.panTo(ll);
  updLine(); if(tab==='near'||tab==='sel'||tab==='res')render();
}
function onErr(e){document.getElementById('gps').textContent='GPS: '+(e.code===1?'permissão negada':'sem sinal');}
let watchId=null;
let wl=null;async function keepAwake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&watchId!=null)keepAwake()});
function startGPS(){keepAwake();
  if(!navigator.geolocation){toast('Este navegador não tem GPS');return}
  if(watchId==null)watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
}
function locBtnUI(){document.getElementById('locBtn').classList.toggle('on',follow)}
document.getElementById('locBtn').onclick=()=>{startGPS();follow=!follow;locBtnUI();if(follow&&me)map.setView([me.y,me.x],Math.max(map.getZoom(),19))};
map.on('dragstart',()=>{if(follow){follow=false;locBtnUI()}});
// bússola (opcional)
let compass=null;
function onOri(e){let h=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.absolute&&e.alpha!=null?360-e.alpha:null);if(h!=null){compass=h;document.querySelectorAll('.arrow[data-b]').forEach(a=>a.style.transform=`rotate(${(+a.dataset.b-compass+360)%360}deg)`)}}
function startCompass(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')addEventListener('deviceorientation',onOri)}).catch(()=>{})}
    else{addEventListener('deviceorientationabsolute',onOri);addEventListener('deviceorientation',onOri)}
  }catch(e){}
}
function arrow(b){const rot=compass==null?b:(b-compass+360)%360;return `<span class="arrow" data-b="${b}" style="transform:rotate(${rot}deg)">⬆</span>`}
function updLine(){
  if(line){map.removeLayer(line);line=null}
  if(me&&cur&&cur.y!=null)line=L.polyline([[me.y,me.x],[cur.y,cur.x]],{color:'#ff6d00',weight:3,dashArray:'6 6'}).addTo(map);
}

// ---------- UI ----------
const body=document.getElementById('body');
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1600)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shortSp(s){return s.split(' ').filter(w=>/^[A-Za-zÀ-ÿ-]+$/.test(w)&&w[0]===w[0].toLowerCase()||s.split(' ')[0]===w).slice(0,2).join(' ')}
function genSp(d){const w=d.s.split(/\s+/);let g=w[0]||'Indet',e=(w[1]&&/^[a-z]/.test(w[1]))?w[1]:'sp';if(g==='Indet.')return 'Indet';return g+'_'+e}
function specName(d){const n=(st.col[d.i]&&st.col[d.i].n)||0;return `${st.prefix}${d.i}_${genSp(d)}${st.suffix}`}
function row(d){
  let dd='';
  if(me&&d.y!=null){const m=dist(me.y,me.x,d.y,d.x),b=bearing(me.y,me.x,d.y,d.x);dd=`${fmtD(m)}<br>${arrow(b)} ${card(b)}`}
  const done=st.col[d.i]?' <span class="done">✔</span>':'';
  return `<div class="row" data-i="${esc(d.i)}"><span class="c">${esc(d.i)}${done}</span><span class="s">${esc(d.s)}<small>${esc(d.f)} · ${esc(d.l)}</small></span><span class="d">${dd}</span></div>`;
}
function bindRows(){body.querySelectorAll('.row').forEach(r=>r.onclick=()=>select(byId[r.dataset.i],true))}
const byId={};DATA.forEach(d=>byId[d.i]=d);
function setTab(t){tab=t;document.querySelectorAll('.tab[data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t===t));body.classList.remove('hide');render()}
document.querySelectorAll('.tab[data-t]').forEach(x=>x.onclick=()=>setTab(x.dataset.t));
document.getElementById('minBtn').onclick=()=>{body.classList.toggle('hide');document.getElementById('minBtn').textContent=body.classList.contains('hide')?'▴':'▾'};

function render(){
  document.getElementById('nCol').textContent=Object.keys(st.col).length;document.getElementById('nTgt').textContent=Object.keys(st.tgt).length;
  if(tab==='near'){
    if(!me){body.innerHTML=`<div class="tools"><button class="btn on" id="g1">📍 Ligar GPS</button><span style="color:#666">para listar as árvores mais perto de você</span></div>`;document.getElementById('g1').onclick=()=>{startGPS();startCompass();toast('Aguardando sinal do GPS…')};return}
    const L2=pts.filter(visible).map(d=>[dist(me.y,me.x,d.y,d.x),d]).sort((a,b)=>a[0]-b[0]).slice(0,25).map(x=>x[1]);
    body.innerHTML=L2.map(row).join('');bindRows();
  } else if(tab==='sel'){
    if(!cur){body.innerHTML='<p class="note" style="padding:14px">Toque numa árvore no mapa ou numa lista.</p>';return}
    const d=cur, c=st.col[d.i];
    let dd='';
    if(me&&d.y!=null){const m=dist(me.y,me.x,d.y,d.x),b=bearing(me.y,me.x,d.y,d.x);dd=`<div class="big">${fmtD(m)} ${arrow(b)} <span style="font-size:16px">${card(b)} (${Math.round(b)}°)</span></div>`}
    body.innerHTML=`<div class="card"><h3>${esc(d.i)} ${c?'<span class="done">✔</span>':''}</h3>
      <div class="sp">${esc(d.s)}</div>
      <div class="meta">${esc(d.f)} · ${esc(d.l)} · acesso ${esc(d.a)} · linha ${d.r} da planilha${d.y!=null?`<br>${d.y.toFixed(6)}, ${d.x.toFixed(6)}`:'<br><b>sem coordenadas</b>'}</div>
      ${dd}
      <div class="nmL">Nome do espectro (digitar no PC):</div><div class="nm" id="nm">${esc(specName(d)).replace(/_/g,'<span class="us">_</span>')}</div>
      <div class="acts" style="margin-top:10px">
        <button class="btn ${st.tgt[d.i]?'on':''}" id="tr">${st.tgt[d.i]?'⭐ Na rota':'☆ Pôr na rota'}</button>
        <button class="btn ${c?'on':''}" id="tg">${c?'✔ Coletada':'Marcar coletada'}</button>
        ${d.y!=null?'<button class="btn" id="go">🎯 Centralizar</button>':''}
      </div>
      ${c?`<div class="tools">Nº de espectros: <button class="btn" id="mn">−</button><b>${c.n||0}</b><button class="btn" id="pl">+</button></div>
      <div class="tools"><input type="text" id="ob" placeholder="Observação (ex.: casca com líquen)" value="${esc(c.o||'')}" style="flex:1"></div>`:''}
    </div>`;
    document.getElementById('tg').onclick=()=>{if(st.col[d.i])delete st.col[d.i];else st.col[d.i]={t:new Date().toISOString(),n:0,o:'',lat:me?me.y:null,lon:me?me.x:null};save();drawMarkers();render()};
    document.getElementById('tr').onclick=()=>{if(st.tgt[d.i])delete st.tgt[d.i];else st.tgt[d.i]=1;save();drawMarkers();render()};
    const go=document.getElementById('go');if(go)go.onclick=()=>{follow=false;locBtnUI();map.setView([d.y,d.x],20)};
    if(c){document.getElementById('mn').onclick=()=>{c.n=Math.max(0,(c.n||0)-1);save();render()};document.getElementById('pl').onclick=()=>{c.n=(c.n||0)+1;save();render()};document.getElementById('ob').onchange=e=>{c.o=e.target.value;save()}}
  } else if(tab==='res'){
    body.innerHTML=results.length?`<div class="tools"><b>${results.length}</b> árvore(s) · ${results.filter(d=>d.y!=null).length} no mapa <button class="btn" id="clq">✕ Limpar busca</button></div>`+results.slice(0,200).map(row).join(''):'<p class="note" style="padding:14px">Digite na busca acima.</p>';bindRows();
    {const c=document.getElementById('clq');if(c)c.onclick=()=>{document.getElementById('q').value='';results=[];hiSet=null;drawMarkers();setTab('near')}}

  } else if(tab==='spp'){
    const f=norm(sppFilter);
    const L5=SPP.filter(s=>!f||s._k.includes(f));
    body.innerHTML=`<div class="tools"><input type="text" id="sf2" placeholder="Filtrar espécie ou família" value="${esc(sppFilter)}" style="flex:1"></div><p class="note">Toque numa espécie para destacar todos os indivíduos no mapa. ⭐ põe todos na rota.</p>`+
      L5.map((s,k)=>`<div class="row" data-k="${SPP.indexOf(s)}"><span class="s">${esc(s.s)}<small>${esc(s.f)}</small></span><span class="d">${s.g}<small style="display:block;color:#666;font-weight:400">${s.n>s.g?'+'+(s.n-s.g)+' s/ GPS':'ind.'}</small></span><button class="btn" data-st="${SPP.indexOf(s)}" style="min-height:36px">⭐</button></div>`).join('');
    const inp=document.getElementById('sf2');inp.oninput=e=>{sppFilter=e.target.value;clearTimeout(inp.t);inp.t=setTimeout(()=>{const p=inp.selectionStart;render();const n=document.getElementById('sf2');n.focus();n.setSelectionRange(p,p)},250)};
    body.querySelectorAll('.row[data-k]').forEach(r=>r.onclick=ev=>{if(ev.target.dataset.st)return;showSpecies(SPP[+r.dataset.k])});
    body.querySelectorAll('[data-st]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const s=SPP[+b.dataset.st];DATA.filter(d=>d.s===s.s&&d.y!=null).forEach(d=>st.tgt[d.i]=1);save();drawMarkers();document.getElementById('nTgt').textContent=Object.keys(st.tgt).length;toast(s.g+' árvore(s) na rota')});
  } else if(tab==='rota'){
    let T=Object.keys(st.tgt).map(i=>byId[i]).filter(Boolean);
    const dd=d=>me&&d.y!=null?dist(me.y,me.x,d.y,d.x):1e9;
    T.sort((a,b)=>(!!st.col[a.i])-(!!st.col[b.i])||dd(a)-dd(b)||a.i.localeCompare(b.i));
    const nx=T.find(d=>!st.col[d.i]&&d.y!=null);
    let top='';
    if(!T.length)top='<p class="note" style="padding:14px">Monte a rota com as árvores que vocês querem amostrar: na ficha (☆ Pôr na rota) ou na aba Espécies (⭐). Aqui elas aparecem da mais próxima para a mais distante, e a já coletada sai da frente.</p>';
    else if(nx){const m=me?fmtD(dd(nx)):'',b=me?bearing(me.y,me.x,nx.y,nx.x):0;top=`<div class="card" style="background:#fffde7"><div style="font-size:12px;color:#666">PRÓXIMO ALVO (${T.filter(d=>!st.col[d.i]).length} restantes)</div><h3>${esc(nx.i)}</h3><div class="sp">${esc(nx.s)}</div>${me?`<div class="big">${m} ${arrow(b)} <span style="font-size:16px">${card(b)}</span></div>`:'<div class="meta">Ligue o GPS para ordenar pela distância.</div>'}<div class="acts" style="margin-top:8px"><button class="btn on" id="gonx">Ir para ele</button><button class="btn" id="showR">Ver rota no mapa</button><button class="btn" id="clrR">Limpar rota</button></div></div>`}
    else top='<div class="card"><b>🎉 Todos os alvos coletados.</b> <button class="btn" id="clrR">Limpar rota</button></div>';
    body.innerHTML=top+T.map(row).join('');bindRows();
    const g=document.getElementById('gonx');if(g)g.onclick=()=>select(nx,true);
    const sr=document.getElementById('showR');if(sr)sr.onclick=()=>{document.getElementById('q').value='';results=T;applyHi(true)};
    const cr=document.getElementById('clrR');if(cr)cr.onclick=()=>{if(cr.dataset.k){st.tgt={};save();drawMarkers();render()}else{cr.dataset.k=1;cr.textContent='Confirmar?'}};
  } else if(tab==='col'){
    const L3=Object.keys(st.col).map(i=>byId[i]).filter(Boolean);
    body.innerHTML=`<div class="tools"><button class="btn" id="cpCsv">📋 Copiar tabela</button><button class="btn" id="dlCsv">⬇️ Baixar CSV</button><button class="btn" id="clr">Limpar</button></div>`+L3.map(row).join('');
    bindRows();
    document.getElementById('cpCsv').onclick=()=>copy(csv());
    document.getElementById('dlCsv').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv()],{type:'text/csv'}));a.download='espectros_casca_coletadas.csv';a.click()}catch(e){toast('Use “Copiar tabela”')}};
    document.getElementById('clr').onclick=()=>{const b=document.getElementById('clr');if(b.dataset.k){st.col={};save();drawMarkers();render()}else{b.dataset.k=1;b.textContent='Toque de novo p/ confirmar'}};
  } else if(tab==='nocoord'){
    const L4=DATA.filter(d=>d.y==null).sort((a,b)=>a.l.localeCompare(b.l)||a.i.localeCompare(b.i));
    body.innerHTML=`<p class="note">${L4.length} árvores da planilha não têm coordenadas (segundo o Mike, algumas podem não existir mais). Ordenadas por local.</p>`+L4.map(row).join('');bindRows();
  } else if(tab==='cfg'){
    const fams=[...new Set(DATA.map(d=>d.f).filter(Boolean))].sort();
    body.innerHTML=`<div class="tools"><label><input type="checkbox" id="hp" ${st.hidePalm?'checked':''}> Ocultar palmeiras (Arecaceae)</label></div>
    <div class="tools"><label><input type="checkbox" id="hc" ${st.hideCol?'checked':''}> Ocultar já coletadas</label></div>
    <div class="tools">Família: <select id="fm"><option value="">todas</option>${fams.map(f=>`<option ${f===st.fam?'selected':''}>${esc(f)}</option>`).join('')}</select></div>
    <div class="tools">Nome do espectro: <input type="text" id="pf" placeholder="prefixo" value="${esc(st.prefix)}" style="width:90px">CÓDIGO_Gênero_epíteto<input type="text" id="sf" placeholder="sufixo" value="${esc(st.suffix)}" style="width:90px"></div>
    <p class="note">Ex.: ${esc(st.prefix)}GR601_Carapa_guianensis${esc(st.suffix)} — complete com o tipo de casca (externa/interna) na hora de salvar. Quando o mesmo nº de acesso aparece em mais de uma árvore, o código recebe -1, -2… (ordem da planilha).<br>As marcações de “coletada” ficam salvas só neste celular/navegador.</p>
    <div class="tools"><button class="btn" id="cp2">🧭 Ativar bússola</button></div>`;
    document.getElementById('hp').onchange=e=>{st.hidePalm=e.target.checked;save();drawMarkers()};
    document.getElementById('hc').onchange=e=>{st.hideCol=e.target.checked;save();drawMarkers()};
    document.getElementById('fm').onchange=e=>{st.fam=e.target.value;save();drawMarkers()};
    document.getElementById('pf').oninput=e=>{st.prefix=e.target.value.trim();save()};
    document.getElementById('sf').oninput=e=>{st.suffix=e.target.value.trim();save()};
    document.getElementById('cp2').onclick=()=>{startCompass();toast('Bússola ativada (se o aparelho tiver)')};
  }
}
function csv(){
  const h='codigo;acesso;familia;especie;local;lat;lon;n_espectros;nome_espectro;obs;hora;lat_gps;lon_gps';
  return [h].concat(Object.entries(st.col).map(([i,c])=>{const d=byId[i];if(!d)return'';return [d.i,d.a,d.f,d.s,d.l,d.y??'',d.x??'',c.n||0,specName(d),(c.o||'').replace(/;/g,','),c.t,c.lat??'',c.lon??''].join(';')})).join('\n');
}
function copy(t){
  const ok=()=>toast('Copiado: '+(t.length>40?t.slice(0,40)+'…':t));
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok).catch(fb);else fb();
  function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Não foi possível copiar')}a.remove()}
}
function select(d,pan){
  cur=d;drawMarkers();updLine();setTab('sel');
  if(pan&&d.y!=null){follow=false;locBtnUI();map.setView([d.y,d.x],Math.max(map.getZoom(),19))}
}
// destaque de resultados no mapa
function applyHi(fit){
  hiSet=new Set(results.map(d=>d.i));drawMarkers();
  const P=results.filter(d=>d.y!=null);
  if(fit&&P.length){follow=false;locBtnUI();if(P.length===1)map.setView([P[0].y,P[0].x],20);else map.fitBounds(L.latLngBounds(P.map(d=>[d.y,d.x])),{paddingTopLeft:[30,70],paddingBottomRight:[60,document.getElementById('sheet').offsetHeight+20],maxZoom:20})}
}
function showSpecies(s){document.getElementById('q').value=s.s;results=DATA.filter(d=>d.s===s.s);applyHi(true);setTab('res')}
let sppFilter='';
const SPP=(()=>{const m={};DATA.forEach(d=>{const k=d.s;(m[k]=m[k]||{s:k,f:d.f,n:0,g:0}).n++;if(d.y!=null)m[k].g++});Object.values(m).forEach(s=>s._k=norm(s.s+' '+s.f));return Object.values(m).sort((a,b)=>a.s.localeCompare(b.s))})();
// busca
function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
DATA.forEach(d=>d._k=norm([d.i,d.a,d.s,d.f,d.l].join(' ')));
let qt;document.getElementById('q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{
  const q=norm(e.target.value.trim());
  if(!q){results=[];hiSet=null;drawMarkers();setTab('near');return}
  const terms=q.split(/\s+/);
  results=DATA.filter(d=>terms.every(t=>d._k.includes(t)));
  if(me)results.sort((a,b)=>(a.y==null)-(b.y==null)||(a.y!=null&&b.y!=null?dist(me.y,me.x,a.y,a.x)-dist(me.y,me.x,b.y,b.x):0));
  applyHi(true);setTab('res');
  const exact=byId[e.target.value.trim().toUpperCase()];if(exact)select(exact,true);
},250)});

let cw=250;const cImg=document.getElementById('cImg'),cS=document.getElementById('cScroll');
function cz(f){const cx=(cS.scrollLeft+cS.clientWidth/2)/cImg.offsetWidth,cy=(cS.scrollTop+cS.clientHeight/2)/cImg.offsetHeight;cw=Math.min(800,Math.max(100,cw*f));cImg.style.width=cw+'%';cS.scrollLeft=cx*cImg.offsetWidth-cS.clientWidth/2;cS.scrollTop=cy*cImg.offsetHeight-cS.clientHeight/2}
document.getElementById('campBtn').onclick=()=>{document.getElementById('camp').style.display='flex';if(!cS.dataset.i){cS.dataset.i=1;setTimeout(()=>{cS.scrollLeft=cImg.offsetWidth*0.35;cS.scrollTop=0},50)}};
document.getElementById('cX').onclick=()=>document.getElementById('camp').style.display='none';
document.getElementById('cz+').onclick=()=>cz(1.4);document.getElementById('cz-').onclick=()=>cz(1/1.4);
drawMarkers();fitAll();render();
</script>
</body>
</html>
